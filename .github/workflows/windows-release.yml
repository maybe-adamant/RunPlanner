name: Windows release
run-name: Windows release v${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable release version without the v prefix (for example, 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Build, sign and launch-test only; create no tag, draft or release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-release
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Prepare release metadata
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/assert-release-version.mjs $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw 'Release version validation failed. See the diagnostic above.'
          }
          if ($env:GITHUB_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'GitHub must supply a full lowercase commit hash for an official release.'
          }

          $comparison = gh api "repos/$env:GITHUB_REPOSITORY/compare/main...$env:GITHUB_SHA" --jq .status
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to compare the release commit against main.'
          }
          if ($comparison -notin @('identical', 'behind')) {
            throw "Official releases must be dispatched from a commit on main (comparison: $comparison)."
          }

          $version = $env:RELEASE_VERSION
          $tag = "v$version"
          $tagLines = @(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect the existing release tag $tag."
          }
          if ($tagLines.Count -gt 0) {
            $peeledLine = $tagLines | Where-Object { $_.EndsWith('^{}') } | Select-Object -First 1
            $resolvedLine = if ($null -ne $peeledLine) { $peeledLine } else { $tagLines[0] }
            $tagSha = ($resolvedLine -split '\s+')[0]
            if ($tagSha -ne $env:GITHUB_SHA) {
              throw "Release tag $tag already points to $tagSha instead of $env:GITHUB_SHA."
            }
          }

          $configPath = Join-Path $env:RUNNER_TEMP 'tauri.release.conf.json'
          $config = @{ version = $version } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText(
            $configPath,
            $config,
            [System.Text.UTF8Encoding]::new($false)
          )

          "release_version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "release_sha=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT
          "tauri_config=$configPath" >> $env:GITHUB_OUTPUT

      - name: Require updater signing configuration
        shell: pwsh
        env:
          # Only whether the secret is set; the key itself reaches the signing step alone.
          SIGNING_KEY_PRESENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node scripts/updater-release.mjs assert-pubkey apps/planner/src-tauri/tauri.conf.json
          if ($LASTEXITCODE -ne 0) {
            throw 'Updater public key validation failed. See the diagnostic above.'
          }
          if ($env:SIGNING_KEY_PRESENT -ne 'true') {
            throw 'The TAURI_SIGNING_PRIVATE_KEY repository secret must hold the updater signing key.'
          }

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-03

      # The release build runs uncached, and without the signing key: dependency
      # build scripts never see it. The key and password reach only the signing
      # step. Moving both secrets into a `release` environment restricted to
      # main is recommended hardening.
      - name: Build installer
        shell: pwsh
        env:
          RUN_PLANNER_BUILD_COMMIT: ${{ steps.release.outputs.release_sha }}
          RUN_PLANNER_OFFICIAL_RELEASE: 'true'
          RUN_PLANNER_RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          TAURI_RELEASE_CONFIG: ${{ steps.release.outputs.tauri_config }}
        run: |
          npm exec --workspace @run-planner/planner -- tauri build --bundles nsis --no-sign --config "$env:TAURI_RELEASE_CONFIG" -- --locked

      - name: Stage installer
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          $bundle = 'apps/planner/src-tauri/target/release/bundle/nsis'
          $installers = @(Get-ChildItem $bundle -Filter "*_$($env:RELEASE_VERSION)_x64-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected one $env:RELEASE_VERSION NSIS installer in $bundle, found $($installers.Count)."
          }

          $artifactName = "RunPlanner-$env:RELEASE_VERSION-windows-x64-setup"
          $staging = Join-Path $env:RUNNER_TEMP 'release'
          $installer = Join-Path $staging "$artifactName.exe"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item $installers[0].FullName $installer

          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          "installer=$installer" >> $env:GITHUB_OUTPUT

      - name: Sign installer for the updater
        shell: pwsh
        env:
          INSTALLER: ${{ steps.package.outputs.installer }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'The TAURI_SIGNING_PRIVATE_KEY repository secret must hold the updater signing key.'
          }
          node node_modules/@tauri-apps/cli/tauri.js signer sign "$env:INSTALLER"
          if ($LASTEXITCODE -ne 0) {
            throw 'Updater signing failed.'
          }
          if (-not (Test-Path "$env:INSTALLER.sig")) {
            throw "The updater signature $env:INSTALLER.sig was not produced."
          }

      - name: Install and smoke-test desktop launch
        shell: pwsh
        env:
          INSTALLER: ${{ steps.package.outputs.installer }}
        run: |
          $setup = Start-Process $env:INSTALLER -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            throw "The installer exited with code $($setup.ExitCode)."
          }
          $installDir = Join-Path $env:LOCALAPPDATA 'Run Planner'
          $binaries = @(Get-ChildItem $installDir -Filter '*.exe' | Where-Object { $_.Name -notlike 'uninstall*' })
          if ($binaries.Count -ne 1) {
            throw "Expected one installed application executable in $installDir, found: $($binaries.Name -join ', ')."
          }
          $process = Start-Process $binaries[0].FullName -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "Run Planner exited during the desktop launch smoke test with code $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id
            }
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.installer }}
            ${{ steps.package.outputs.installer }}.sig
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Download installer artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
            if [ "${existing_sha}" != "${RELEASE_SHA}" ]; then
              echo "Release tag ${RELEASE_TAG} points to ${existing_sha}, not ${RELEASE_SHA}." >&2
              exit 1
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${RELEASE_SHA}" >/dev/null
          fi

      - name: Create or resume draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            if [ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Release ${RELEASE_TAG} is already published and cannot be replaced." >&2
              exit 1
            fi
          else
            gh release create "${RELEASE_TAG}" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "Run Planner ${RELEASE_TAG}"
          fi

      - name: Assemble updater manifest
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ needs.build.outputs.artifact_name }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: |
          gh release view "${RELEASE_TAG}" --json body --jq .body > release/notes.md
          node scripts/updater-release.mjs manifest \
            --config apps/planner/src-tauri/tauri.conf.json \
            --version "${RELEASE_VERSION}" \
            --repository "${GITHUB_REPOSITORY}" \
            --asset "${RELEASE_ARTIFACT}.exe" \
            --signature "release/${RELEASE_ARTIFACT}.exe.sig" \
            --notes release/notes.md \
            --out release/latest.json

      - name: Upload installer assets to draft
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ needs.build.outputs.artifact_name }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          if [ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "Release ${RELEASE_TAG} is already published and cannot be replaced." >&2
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" \
            "release/${RELEASE_ARTIFACT}.exe" \
            "release/${RELEASE_ARTIFACT}.exe.sig" \
            release/latest.json \
            --clobber

      - name: Publish complete draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ needs.build.outputs.artifact_name }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: |
          node scripts/assert-release-version.mjs "${RELEASE_VERSION}"
          if [ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "Release ${RELEASE_TAG} is already published and cannot be replaced." >&2
            exit 1
          fi
          mapfile -t uploaded_assets < <(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')
          for asset in "${RELEASE_ARTIFACT}.exe" "${RELEASE_ARTIFACT}.exe.sig" latest.json; do
            if ! printf '%s\n' "${uploaded_assets[@]}" | grep -Fqx "${asset}"; then
              echo "Draft release ${RELEASE_TAG} is missing ${asset}." >&2
              exit 1
            fi
          done
          gh release edit "${RELEASE_TAG}" --draft=false --latest
