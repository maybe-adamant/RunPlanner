name: Windows portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable release version without the v prefix (for example, 0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64 portable archive
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Prepare release metadata
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release version must be a stable SemVer value such as 0.1.0."
          }
          if ($env:GITHUB_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'GitHub must supply a full lowercase commit hash for an official release.'
          }

          $version = $env:RELEASE_VERSION
          $tag = "v$version"
          $tagLines = @(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect the existing release tag $tag."
          }
          if ($tagLines.Count -gt 0) {
            $peeledLine = $tagLines | Where-Object { $_.EndsWith('^{}') } | Select-Object -First 1
            $resolvedLine = if ($null -ne $peeledLine) { $peeledLine } else { $tagLines[0] }
            $tagSha = ($resolvedLine -split '\s+')[0]
            if ($tagSha -ne $env:GITHUB_SHA) {
              throw "Release tag $tag already points to $tagSha instead of $env:GITHUB_SHA."
            }
          }

          function Compare-StableVersion([string] $left, [string] $right) {
            $leftParts = $left.Split('.')
            $rightParts = $right.Split('.')
            for ($index = 0; $index -lt 3; $index++) {
              if ($leftParts[$index].Length -ne $rightParts[$index].Length) {
                return $leftParts[$index].Length.CompareTo($rightParts[$index].Length)
              }
              $componentComparison = [string]::CompareOrdinal($leftParts[$index], $rightParts[$index])
              if ($componentComparison -ne 0) {
                return $componentComparison
              }
            }
            return 0
          }

          $publishedTags = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect published stable releases.'
          }
          foreach ($publishedTag in $publishedTags) {
            if ($publishedTag -match '^v((0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
              if ((Compare-StableVersion $version $Matches[1]) -le 0) {
                throw "Release version $version must be newer than published stable release $publishedTag."
              }
            }
          }

          $configPath = Join-Path $env:RUNNER_TEMP 'tauri.release.conf.json'
          $config = @{ version = $version } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText(
            $configPath,
            $config,
            [System.Text.UTF8Encoding]::new($false)
          )

          "release_version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "release_sha=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT
          "tauri_config=$configPath" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-03

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: apps/planner/src-tauri -> target

      - name: Build portable desktop executable
        shell: pwsh
        env:
          RUN_PLANNER_BUILD_COMMIT: ${{ steps.release.outputs.release_sha }}
          RUN_PLANNER_OFFICIAL_RELEASE: 'true'
          RUN_PLANNER_RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          TAURI_RELEASE_CONFIG: ${{ steps.release.outputs.tauri_config }}
        run: |
          npm exec --workspace @run-planner/planner -- tauri build --no-bundle --config "$env:TAURI_RELEASE_CONFIG" -- --locked

      - name: Smoke-test desktop launch
        shell: pwsh
        run: |
          $binary = Resolve-Path "apps/planner/src-tauri/target/release/run-planner.exe"
          $process = Start-Process $binary -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "Run Planner exited during the desktop launch smoke test with code $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id
            }
          }

      - name: Create portable archive
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          $artifactName = "RunPlanner-$env:RELEASE_VERSION-windows-x64-portable"
          $staging = Join-Path $env:RUNNER_TEMP $artifactName
          $archive = Join-Path $env:RUNNER_TEMP "$artifactName.zip"
          $checksum = "$archive.sha256"

          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "apps/planner/src-tauri/target/release/run-planner.exe" (Join-Path $staging "RunPlanner-$env:RELEASE_VERSION.exe")
          Copy-Item "apps/planner/src-tauri/PORTABLE_README.txt" (Join-Path $staging "README.txt")
          Compress-Archive -Path "$staging/*" -DestinationPath $archive

          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          Set-Content -Path $checksum -Value "$hash  $artifactName.zip"

          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
            if [ "${existing_sha}" != "${RELEASE_SHA}" ]; then
              echo "Release tag ${RELEASE_TAG} points to ${existing_sha}, not ${RELEASE_SHA}." >&2
              exit 1
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${RELEASE_SHA}" >/dev/null
          fi

      - name: Create or resume draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            if [ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Release ${RELEASE_TAG} is already published and cannot be replaced." >&2
              exit 1
            fi
          else
            gh release create "${RELEASE_TAG}" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "Run Planner ${RELEASE_TAG}"
          fi

      - name: Upload portable assets to draft
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ needs.build.outputs.artifact_name }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          if [ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "Release ${RELEASE_TAG} is already published and cannot be replaced." >&2
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" \
            "release/${RELEASE_ARTIFACT}.zip" \
            "release/${RELEASE_ARTIFACT}.zip.sha256" \
            --clobber

      - name: Publish complete draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ needs.build.outputs.artifact_name }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: |
          require_newer_than_published() {
            local published_tags published_tag published_version comparison index
            local -a release_parts published_parts
            published_tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')" || return 1
            while IFS= read -r published_tag; do
              if [[ ! "${published_tag}" =~ ^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$) ]]; then
                continue
              fi
              published_version="${BASH_REMATCH[1]}"
              IFS='.' read -r -a release_parts <<< "${RELEASE_VERSION}"
              IFS='.' read -r -a published_parts <<< "${published_version}"
              comparison=0
              for index in 0 1 2; do
                if (( ${#release_parts[index]} > ${#published_parts[index]} )); then
                  comparison=1
                  break
                elif (( ${#release_parts[index]} < ${#published_parts[index]} )); then
                  comparison=-1
                  break
                elif [[ "${release_parts[index]}" > "${published_parts[index]}" ]]; then
                  comparison=1
                  break
                elif [[ "${release_parts[index]}" < "${published_parts[index]}" ]]; then
                  comparison=-1
                  break
                fi
              done
              if (( comparison <= 0 )); then
                echo "Release version ${RELEASE_VERSION} must be newer than published stable release ${published_tag}." >&2
                return 1
              fi
            done <<< "${published_tags}"
          }

          require_newer_than_published
          if [ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "Release ${RELEASE_TAG} is already published and cannot be replaced." >&2
            exit 1
          fi
          mapfile -t uploaded_assets < <(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')
          for asset in "${RELEASE_ARTIFACT}.zip" "${RELEASE_ARTIFACT}.zip.sha256"; do
            if ! printf '%s\n' "${uploaded_assets[@]}" | grep -Fqx "${asset}"; then
              echo "Draft release ${RELEASE_TAG} is missing ${asset}." >&2
              exit 1
            fi
          done
          gh release edit "${RELEASE_TAG}" --draft=false --latest
