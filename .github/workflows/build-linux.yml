name: Build Linux
run-name: Build Linux v${{ inputs.version }}

# Builds, updater-signs and launch-tests the Linux AppImage.
# The release workflow calls it after validating the version; a manual dispatch
# is a build-only check that never tags, drafts or publishes.
on:
  workflow_call:
    inputs:
      version:
        description: 'Validated stable release version without the v prefix'
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
    outputs:
      artifact_name:
        description: 'Workflow artifact holding the AppImage and its updater signature'
        value: ${{ jobs.build.outputs.artifact_name }}
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version to stamp into the build-only check (for example, 0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build signed Linux x64 AppImage
    # The oldest supported runner keeps the AppImage's glibc floor low.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Prepare release configuration
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/assert-release-version.mjs "${RELEASE_VERSION}"
          config_path="${RUNNER_TEMP}/tauri.release.conf.json"
          jq -n --arg version "${RELEASE_VERSION}" '{version: $version}' > "${config_path}"

          {
            echo "release_version=${RELEASE_VERSION}"
            echo "release_sha=${GITHUB_SHA}"
            echo "tauri_config=${config_path}"
          } >> "${GITHUB_OUTPUT}"

      - name: Require updater signing configuration
        env:
          # Only whether the secret is set; the key itself reaches the signing step alone.
          SIGNING_KEY_PRESENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node scripts/updater-release.mjs assert-pubkey apps/planner/src-tauri/tauri.conf.json
          if [ "${SIGNING_KEY_PRESENT}" != 'true' ]; then
            echo 'The TAURI_SIGNING_PRIVATE_KEY repository secret must hold the updater signing key.' >&2
            exit 1
          fi

      # WebKitGTK, GTK, librsvg and OpenSSL (native-tls) for the Tauri host,
      # D-Bus for tao, file and FUSE 2 for the AppImage bundler, Xvfb for the
      # launch smoke test.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            file \
            libdbus-1-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            xvfb

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-03

      # The release build runs uncached, and without the signing key: dependency
      # build scripts never see it. The key and password reach only the signing
      # step.
      - name: Build AppImage
        env:
          RUN_PLANNER_BUILD_COMMIT: ${{ steps.release.outputs.release_sha }}
          RUN_PLANNER_OFFICIAL_RELEASE: 'true'
          RUN_PLANNER_RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          TAURI_RELEASE_CONFIG: ${{ steps.release.outputs.tauri_config }}
        run: |
          npm exec --workspace @run-planner/planner -- tauri build --bundles appimage --no-sign --config "${TAURI_RELEASE_CONFIG}" -- --locked

      - name: Stage AppImage
        id: package
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          bundle=apps/planner/src-tauri/target/release/bundle/appimage
          mapfile -t appimages < <(find "${bundle}" -maxdepth 1 -type f -name "*_${RELEASE_VERSION}_amd64.AppImage")
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "Expected one ${RELEASE_VERSION} AppImage in ${bundle}, found ${#appimages[@]}." >&2
            exit 1
          fi

          artifact_name="RunPlanner-${RELEASE_VERSION}-linux-x64"
          staging="${RUNNER_TEMP}/release"
          mkdir -p "${staging}"
          cp "${appimages[0]}" "${staging}/${artifact_name}.AppImage"
          chmod +x "${staging}/${artifact_name}.AppImage"

          {
            echo "artifact_name=${artifact_name}"
            echo "appimage=${staging}/${artifact_name}.AppImage"
          } >> "${GITHUB_OUTPUT}"

      # The updater picks its manifest entry by the bundle type Tauri patches
      # into the packaged executable over its unknown-type marker.
      - name: Verify bundle type
        env:
          APPIMAGE: ${{ steps.package.outputs.appimage }}
        run: |
          check="${RUNNER_TEMP}/bundle-check"
          mkdir -p "${check}"
          (cd "${check}" && "${APPIMAGE}" --appimage-extract >/dev/null)
          name="$(sed -n 's/^Exec=\([^ ]*\).*/\1/p' "${check}"/squashfs-root/*.desktop | head -n 1)"
          executable="${check}/squashfs-root/usr/bin/${name}"
          if [ -z "${name}" ] || [ ! -f "${executable}" ]; then
            echo "The AppImage desktop entry names no executable in usr/bin (${name})." >&2
            exit 1
          fi
          # Patching overwrites the unknown marker with the AppImage one, so it
          # outnumbers the unused RPM marker the match arms may also hold.
          count() { grep -aoF "$1" "${executable}" | wc -l; }
          if [ "$(count __TAURI_BUNDLE_TYPE_VAR_UNK)" -ne 0 ] ||
            [ "$(count __TAURI_BUNDLE_TYPE_VAR_APP)" -le "$(count __TAURI_BUNDLE_TYPE_VAR_RPM)" ]; then
            echo "${executable} was not patched with the AppImage bundle type." >&2
            exit 1
          fi
          rm -rf "${check}"

      - name: Sign AppImage for the updater
        env:
          APPIMAGE: ${{ steps.package.outputs.appimage }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo 'The TAURI_SIGNING_PRIVATE_KEY repository secret must hold the updater signing key.' >&2
            exit 1
          fi
          node node_modules/@tauri-apps/cli/tauri.js signer sign "${APPIMAGE}"
          if [ ! -f "${APPIMAGE}.sig" ]; then
            echo "The updater signature ${APPIMAGE}.sig was not produced." >&2
            exit 1
          fi

      # The AppImage extracts itself instead of mounting through FUSE, and
      # WebKitGTK skips DMA-BUF rendering on the GPU-less virtual display.
      - name: Smoke-test desktop launch
        env:
          APPIMAGE: ${{ steps.package.outputs.appimage }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          # The inner script expands its own positional arguments.
          # shellcheck disable=SC2016
          xvfb-run --auto-servernum bash -euo pipefail -c '
            setsid "$1" &
            pid=$!
            sleep 8
            if ! kill -0 "${pid}" 2>/dev/null; then
              status=0
              wait "${pid}" || status=$?
              echo "Run Planner exited during the desktop launch smoke test with code ${status}." >&2
              exit 1
            fi
            kill -TERM -- "-${pid}" 2>/dev/null || true
            wait "${pid}" || true
          ' smoke "${APPIMAGE}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.appimage }}
            ${{ steps.package.outputs.appimage }}.sig
          if-no-files-found: error
          retention-days: 30
