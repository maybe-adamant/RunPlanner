[package]
name = "run-planner-game-host"
version = "0.1.0"
description = "Game module package, game target, install and plan-slot publication for the Run Planner desktop host"
authors = ["maybe-adamant"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "run_planner_game_host"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate-flate2", "time"] }
# zip's flate2 needs an explicit pure-Rust deflate backend.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
