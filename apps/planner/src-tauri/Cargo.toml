[package]
name = "run-planner"
version = "0.1.0"
description = "Standalone Hades II route authoring and simulation application"
authors = ["maybe-adamant"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "run_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["game-host"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
run-planner-game-host = { path = "game-host" }
# The updater's HTTP client, reused for the signed event feed.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Already in the build through wry; used to switch off WebView2 autofill.
webview2-com = "0.38"
windows-core = "0.61"
