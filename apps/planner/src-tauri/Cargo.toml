[package]
name = "run-planner"
version = "0.1.0"
description = "Standalone Hades II route authoring and simulation application"
authors = ["maybe-adamant"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "run_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls-no-alpn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
